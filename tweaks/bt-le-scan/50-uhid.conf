# /etc/systemd/system/bluetooth.service.d/50-uhid.conf
# /dev/uhid belongs to uhid:android_uhid 0660 on this port (70-begonia.rules)
# and bluetoothd runs without CAP_DAC_OVERRIDE, so the HID-over-GATT profile
# (BLE gamepads, keyboards, mice) failed with "input-hog profile accept failed".
[Service]
SupplementaryGroups=android_uhid
