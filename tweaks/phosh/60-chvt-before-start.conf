# Switch to VT7 before the session starts instead of in parallel with it.
# ExecStartPost=chvt 7 (droidian 50-chvt.conf) races with the TTY setup of
# the main process (TTYVHangup on /dev/tty7): capsh gets SIGHUP within ms
# and phosh/hwcomposer (BindsTo each other) restart in a loop.
[Service]
ExecStartPost=
ExecStartPre=+/usr/bin/chvt 7
